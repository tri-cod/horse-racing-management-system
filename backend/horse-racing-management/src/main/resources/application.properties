spring.application.name=horse-racing-management-system

# Nạp file .env ở thư mục module (nếu có) — nhờ đó chỉ cần copy .env.example
# thành .env là chạy được, không phải cấu hình gì trong IDE.
# Khai báo hai đường dẫn vì đường dẫn được tính theo THƯ MỤC LÀM VIỆC, mà nó khác
# nhau tuỳ cách chạy: mvnw chạy từ thư mục module, còn IntelliJ chạy từ gốc repo.
# "optional:" nên chỗ nào không có file thì bỏ qua — kể cả khi deploy, lúc đó biến
# lấy thẳng từ môi trường.
spring.config.import=optional:file:.env[.properties],optional:file:backend/horse-racing-management/.env[.properties]

server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/horse_racing_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Email Verification
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Logging
logging.level.com.horseracing=DEBUG
logging.level.javax.naming=DEBUG
logging.level.org.springframework.mail=DEBUG

# Spring Security
spring.security.user.name=${SECURITY_USER_NAME:caotri}
spring.security.user.password=${SECURITY_USER_PASSWORD:12345}


# Comma-separated list of allowed CORS origins (see CorsConfig)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Multipart upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary — image storage (see CloudinaryConfig / CloudinaryStorageService).
# Credentials come from the Cloudinary dashboard; never commit real values here.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:horse-racing}

spring.mail.username=${MAIL_USERNAME:RoyalDerbyservice@gmail.com}
spring.mail.password=${MAIL_PASSWORD:enoz pmek tgvj ioat}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}

# Resend (HTTP email API — thay SMTP vì Render chặn port 587)
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}


